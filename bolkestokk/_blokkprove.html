<!DOCTYPE html>
<html lang="nn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Blokkprøve — Bolkestokk</title>
<link rel="stylesheet" href="../css/neobrutalisme.css">
<link rel="stylesheet" href="css/palett.css?v=3">
<link rel="stylesheet" href="css/style.css?v=3">
<link rel="stylesheet" href="css/blokk.css?v=3">
<script src="../js/vyrdepil-icons.js" defer></script>
<script src="js/blokkar.js?v=3" defer></script>
<script src="js/tre.js?v=3" defer></script>
<script src="js/editor.js?v=3" defer></script>
<style>
    /* Berre for denne sida. Ho er eit arbeidsverktøy og blir sletta att. */
    body { margin: 0; padding: 24px; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    .prov-intro { max-width: 70ch; font-size: 14px; line-height: 1.6; margin: 0 0 24px; }
    .prov-rutenett { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
    .prov-boks { background: var(--surface); border: 4px solid var(--border); padding: 16px; }
    .prov-boks > h2 {
        margin: 0 0 12px; font-size: 11px; font-weight: 800;
        text-transform: uppercase; letter-spacing: .06em;
    }
    .prov-benk {
        width: 460px;
        background-color: var(--surface);
        background-image: radial-gradient(var(--bs-prikk) 2px, transparent 2px);
        background-size: 28px 28px;
        padding: 26px 22px;
    }
    .prov-palett { width: 300px; background: var(--bs-palettflate); padding: 16px 14px; }
    #maaling {
        margin-top: 28px; padding: 14px; max-width: 70ch;
        font-family: ui-monospace, Consolas, monospace; font-size: 12.5px;
        white-space: pre-wrap; background: var(--bs-hvit); border: 4px solid var(--border);
    }
</style>
</head>
<body class="bs-tema" data-theme="classic">

<h1>Blokkprøve</h1>
<p class="prov-intro">
    Kvar blokktype i kvar posisjon, side om side. Denne sida finst berre for å
    kontrollere at knastar, C-form og palettvariant blir teikna rett — ho er
    ikkje lenka frå noko, og blir sletta før endringa går inn.
    Målingane nedst skal alle vere <strong>OK</strong>.
</p>

<div class="prov-rutenett">
    <section class="prov-boks">
        <h2>Arbeidsbenken</h2>
        <div class="prov-benk" id="benk"></div>
    </section>

    <section class="prov-boks">
        <h2>Blokkvelgeren</h2>
        <div class="prov-palett bs-palett" id="palett"></div>
    </section>
</div>

<pre id="maaling">Måler …</pre>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const T = BolkTre, B = BolkBlokkar;

    /* Eit program som får med alle formene: hatt, vanleg blokk, verdiblokk i
     * hòl, løkke, løkke i løkke, og ein eigen kommando. */
    const p = T.nyttProgram();
    const n = (t, f) => T.nyNode(t, f);

    p.start.push(n('framover', { lengd: 100 }));
    const snu = n('snuHogre');
    snu.felt.grader = n('rekne', { a: 360, op: 'dele', b: 6 });   // verdiblokk i hòl
    p.start.push(snu);

    const ytre = n('gjenta', { tal: 4 });
    ytre.kropp.push(n('framover', { lengd: 80 }));
    const indre = n('gjenta', { tal: 3 });                        // løkke i løkke
    indre.kropp.push(n('setFarge', { farge: 'blaa' }));
    indre.kropp.push(n('snuVenstre', { grader: 120 }));
    ytre.kropp.push(indre);
    ytre.kropp.push(n('settVar', { namn: 'lengd', verdi: 50 }));
    p.start.push(ytre);

    p.start.push(n('pennOpp'));
    p.start.push(n('kallKommando', { namn: 'firkant' }));

    const tom = n('gjenta', { tal: 2 });                           // tom løkke
    p.start.push(tom);
    p.start.push(n('skrivUt', { verdi: 42 }));

    p.kommandoar.push({ namn: 'firkant', kropp: [n('framover', { lengd: 60 })] });

    BolkEditor.init({ palett: document.getElementById('palett'),
                      arbeid: document.getElementById('benk') }, {});
    BolkEditor.set(p);
    BolkEditor.teiknPalett();
    BolkEditor.teikn();

    /* ---- målingane -------------------------------------------------------
     * Dei same påstandane som står i planen. Alt som ikkje er 0 avvik er ein
     * feil, ikkje ein smakssak.
     *
     * Vi ventar to animasjonsbilete OG eit halvt sekund. Fyrste utgåva målte
     * etter 250ms og rapporterte OK for blokker som seinare braut over to
     * linjer: hydrateIcons hadde ikkje sett inn SVG-ane enno, så blokkene
     * var smalare enn dei kom til å bli. */
    const naarLayoutSit = (fn) =>
        requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(fn, 500)));

    naarLayoutSit(() => {
        const ut = [];
        const rund = (x) => Math.round(x);
        const R = (el) => el.getBoundingClientRect();
        const seier = (namn, ok, detalj) =>
            ut.push((ok ? 'OK   ' : 'FEIL ') + namn + (detalj ? '  — ' + detalj : ''));

        const benk = document.getElementById('benk');
        const RAMME = 4;

        // 1. hatt → stabel
        const hatt = benk.querySelector('.bs-hatt');
        const stabel = benk.querySelector('.bs-stabelboks > .bs-stabel');
        const d1 = rund(R(hatt).bottom - R(stabel).top);
        seier('hatt deler ramme med stabelen', d1 === RAMME, d1 + 'px overlapp, venta ' + RAMME);

        // 2. blokk til blokk
        const post = [...stabel.children].filter(x => x.matches('.bs-stabelpost'));
        let verstPar = 0;
        for (let i = 1; i < post.length; i++) {
            verstPar = Math.max(verstPar, Math.abs(rund(R(post[i - 1]).bottom - R(post[i]).top) - RAMME));
        }
        seier('blokkene deler ramme (' + (post.length - 1) + ' par)', verstPar === 0,
              'verste avvik ' + verstPar + 'px');

        // 3–5. løkkene
        let g3 = 0, g4 = 0, g5 = 0;
        benk.querySelectorAll('.bs-krop-ytre').forEach(y => {
            const kropp = y.querySelector(':scope > .bs-krop-midt > .bs-kropp');
            const botn = y.querySelector(':scope > .bs-krop-botn');
            const hovud = y.querySelector(':scope > .bs-blokk');
            const inni = [...kropp.children].filter(x => x.matches('.bs-stabelpost'));
            if (!inni.length) return;
            g3 = Math.max(g3, Math.abs(rund(R(inni[0]).top - R(kropp).top)));
            g4 = Math.max(g4, Math.abs(rund(R(botn).top - R(inni[inni.length - 1]).bottom)));
            g5 = Math.max(g5, Math.abs(rund(R(inni[0]).right - R(hovud).right)));
        });
        seier('fyrste blokk klemt mot løkketoppen', g3 === 0, g3 + 'px gap');
        seier('siste blokk klemt mot løkkefoten', g4 === 0, g4 + 'px gap');
        seier('indre blokk flust med hovudets høgrekant', g5 === 0, g5 + 'px avvik');

        // 6. knastefargen = fargen på blokka over
        let feilFarge = [];
        benk.querySelectorAll('.bs-stabel').forEach(st => {
            const b = [...st.children].filter(x => x.matches('.bs-stabelpost'));
            for (let i = 1; i < b.length; i++) {
                const over = (b[i - 1].dataset.farge) || '';
                const sett = (b[i].style.getPropertyValue('--bs-over') || '').replace(/var\(--bs-|\)/g, '');
                if (over && sett !== over) feilFarge.push(sett + '≠' + over);
            }
        });
        seier('knasten har fargen til blokka over', !feilFarge.length, feilFarge.join(', '));

        // 7. palettblokkene skal vere éi linje
        /* Rekneblokka og tilfeldig-blokka har tre felt kvar og fell over pa
         * to linjer uansett kor mykje vi strammar. Dei er unntekne. */
        const UNNTAK = ['rekne', 'tilfeldig'];
        const hoege = [...document.querySelectorAll('#palett .bs-palettblokk')]
            .map(b => ({ t: b.dataset.type, h: rund(R(b).height) }))
            .filter(x => x.h > 64 && UNNTAK.indexOf(x.t) < 0);
        seier('inga palettblokk over 64px (utan rekne/tilfeldig)', hoege.length === 0,
              hoege.map(x => x.t + '=' + x.h).join(', '));

        // Gjenta i paletten skal ikkje vere ein kloss
        const pg = document.querySelector('#palett .bs-krop-ytre');
        const pgh = pg ? rund(R(pg).height) : 0;
        seier('Gjenta i paletten under 130px', pgh < 130, pgh + 'px');

        document.getElementById('maaling').textContent = ut.join('\n');
    });
});
</script>
</body>
</html>
